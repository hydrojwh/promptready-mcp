[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptready-mcp"
version = "0.3.0"
description = "MCP server (stdio) for PromptReady with browser login + convert tools."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PromptReady" }]
urls = { Homepage = "https://promptready.space", Documentation = "https://promptready.space" }
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[project.scripts]
promptready-mcp = "promptready_mcp.server:main"
promptready-mcp-login = "promptready_mcp.login_flow:run_login_cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["promptready_mcp*"]
